<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Caveat", serif; 
            background-color: #C4F5FC;
            background-image: url("/assets/fish.gif");
            background-size: cover;
        }

        .container {
            max-width: 600px;
            margin: 96px auto;
            background: #C4EBC8;
            padding: 45px;
            border-radius: 70px;
            background-image: url("/assets/gren.jpg");
            background-size: cover;
            box-shadow: 0 7px 6px #f09433(0, 0, 0, 0.1);
            
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid #F2B880;
            border-radius: 100px;
        }

        .button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }

        .button {
            transition: all 0.3s ease-in-out;
            font-family: "Dosis", sans-serif;
            display: inline-block;
            width: calc(50% - 10px);
            height: 50px;
            border-radius: 50px;
            background-image: linear-gradient(135deg, #136F63 0%, #88D498 100%);
            box-shadow: 0 20px 30px -6px rgba(238, 97, 97, 0.5);
            outline: none;
            cursor: pointer;
            border: 2px solid #F3E9D2;
            font-size: 24px;
            color: white;
        }

        .button:hover {
            transform: translateY(3px);
            box-shadow: none;
        }

        .button:active {
            opacity: 0.5;
        }

        .button:disabled {
            background-color: #DB3A34;
        }

        .error {
            color: #DB3A34;
            margin-top: 20px;
        }

        .social-buttons {
            display: flex;
            justify-content: center;
            margin-top: 30px;
            width: 100%;
        }

        .Btn {
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition-duration: 0.4s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            margin-left: 10px;
        }

        .instagram {
            background: linear-gradient(45deg, #f09433 0%, #bc1888 100%);
        }

        .youtube {
            background-color: #ff0000;
        }

        .twitter {
            background-color: #1da1f2;
        }

        .Btn:hover {
            width: 110px;
            border-radius: 30px;
        }

        .text {
            position: absolute;
            color: rgb(255, 255, 255);
            width: 120px;
            font-weight: 600;
            opacity: 0;
            transition-duration: 0.4s;
        }

        .svgIcon {
            transition-duration: 0.3s;
        }

        .svgIcon path {
            fill: white;
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div id="auth-section" style="display: none;">
            <h1>Авторизация</h1>
            <div class="form-group">
                <label for="username"><h3>Имя пользователя</h3></label>
                <input type="text" id="username" placeholder="Введите имя">
            </div>
            <div class="form-group">
                <label for="password"><h3>Пароль</h3></label>
                <input type="password" id="password" placeholder="Введите пароль">
            </div>
            <button class="button" onclick="login()">Войти</button>
            <button class="button" onclick="register()">Регистрация</button>
            <div class="error" id="auth-error"></div>
        </div>

        <div id="rooms-section" style="display: none;">
            <h1>Управление комнатами</h1>
            <div class="form-group">
                <label for="room-name"><h2>Название комнаты</h2></label>
                <input type="text" id="room-name" placeholder="Название">
            </div>
            <div class="form-group">
                <label for="room-visibility"><h2>Тип комнаты</h2></label>
                <select id="room-visibility">
                    <option value="true">Публичная</option>
                    <option value="false">Приватная</option>
                </select>
            </div>
            <div class="button-container">
                <button class="button" onclick="createRoom()">Создать комнату</button>
                <button class="button" onclick="window.location.href = '/chats'">Войти в комнату</button>
                <button class="button" onclick="getPublicRooms()">Список комнат</button>
                <button class="button" onclick="localStorage.removeItem('token'); alert('Выход выполнен');window.location.href = '/';">Выход</button>
            </div>
            <div id="public-rooms"></div>
            <div class="error" id="rooms-error"></div>
        </div>

        <!-- Social Media Buttons Block -->
        <div class="social-buttons">
            <button class="Btn instagram">
                <svg class="svgIcon" viewBox="0 0 448 512" height="1.5em" xmlns="http://www.w3.org/2000/svg">
                    <path d="M224.1 141c-63.6 0-114.9 51.3-114.9 114.9s51.3 114.9 114.9 114.9S339 319.5 339 255.9 287.7 141 224.1 141zm0 189.6c-41.1 0-74.7-33.5-74.7-74.7s33.5-74.7 74.7-74.7 74.7 33.5 74.7 74.7-33.6 74.7-74.7 74.7zm146.4-194.3c0 14.9-12 26.8-26.8 26.8-14.9 0-26.8-12-26.8-26.8s12-26.8 26.8-26.8 26.8 12 26.8 26.8zm76.1 27.2c-1.7-35.9-9.9-67.7-36.2-93.9-26.2-26.2-58-34.4-93.9-36.2-37-2.1-147.9-2.1-184.9 0-35.8 1.7-67.6 9.9-93.9 36.1s-34.4 58-36.2 93.9c-2.1 37-2.1 147.9 0 184.9 1.7 35.9 9.9 67.7 36.2 93.9s58 34.4 93.9 36.2c37 2.1 147.9 2.1 184.9 0 35.9-1.7 67.7-9.9 93.9-36.2 26.2-26.2 34.4-58 36.2-93.9 2.1-37 2.1-147.8 0-184.8zM398.8 388c-7.8 19.6-22.9 34.7-42.6 42.6-29.5 11.7-99.5 9-132.1 9s-102.7 2.6-132.1-9c-19.6-7.8-34.7-22.9-42.6-42.6-11.7-29.5-9-99.5-9-132.1s-2.6-102.7 9-132.1c7.8-19.6 22.9-34.7 42.6-42.6 29.5-11.7 99.5-9 132.1-9s102.7-2.6 132.1 9c19.6 7.8 34.7 22.9 42.6 42.6 11.7 29.5 9 99.5 9 132.1s2.7 102.7-9 132.1z"></path>
                </svg>
                <span class="text">Instagram</span>
            </button>

            <button class="Btn youtube">
                <svg class="svgIcon" viewBox="0 0 576 512" height="1.5em" xmlns="http://www.w3.org/2000/svg">
                    <path d="M549.655 148.28c-6.281-23.64-24.041-42.396-47.655-48.685C462.923 85 288 85 288 85S113.077 85 74 99.595c-23.614 6.289-41.374 25.045-47.655 48.685-12.614 47.328-12.614 147.717-12.614 147.717s0 100.39 12.614 147.718c6.281 23.64 24.041 42.396 47.655 48.684C113.077 427 288 427 288 427s174.923 0 214-14.595c23.614-6.289 41.374-25.045 47.655-48.685 12.614-47.328 12.614-147.718 12.614-147.718s0-100.389-12.614-147.717zM240 336V176l144 80-144 80z"></path>
                </svg>
                <span class="text">YouTube</span>
            </button>

            <button class="Btn twitter">
                <svg class="svgIcon" viewBox="0 0 512 512" height="1.5em" xmlns="http://www.w3.org/2000/svg">
                    <path d="M512 97.248c-18.84 8.36-39.082 14.008-60.277 16.54 21.62-12.92 38.212-33.216 46.042-57.45-20.242 12-42.71 20.67-66.61 25.41-19.128-20.412-46.344-33.21-76.51-33.21-58 0-105 47-105 105 0 8.22.926 16.188 2.714 23.914-87.18-4.376-164.66-46.2-216.45-109.97-9.066 15.508-14.254 33.586-14.254 52.836 0 36.37 18.54 68.542 46.844 87.428-17.272-.554-33.52-5.286-47.754-13.158v1.32c0 50.828 36.13 93.15 84.198 102.79-8.826 2.396-18.14 3.686-27.734 3.686-6.78 0-13.34-.664-19.676-1.902 13.36 41.77 52.164 72.198 98.116 73.052-35.96 28.17-81.38 44.99-130.76 44.99-8.54 0-16.94-.5-25.14-1.476 46.684 29.922 101.99 47.31 161.18 47.31 193.32 0 298.924-160.078 298.924-298.926 0-4.554-.106-9.086-.306-13.594 20.546-14.824 38.364-33.298 52.456-54.422z"></path>
                </svg>
                <span class="text">Twitter</span>
            </button>
        </div>
    </div>

    <script>
        let token = localStorage.getItem('token');
        let currentRoomId = "";

        window.onload = function() {
            if (token) {
                // Если токен есть, сразу показываем главное меню
                document.getElementById("auth-section").style.display = "none";
                document.getElementById("rooms-section").style.display = "block";
            } else {
                // Если токен отсутствует, показываем форму авторизации
                document.getElementById("auth-section").style.display = "block";
            }
        }

        function login() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.token) {
                    token = data.token;
                    localStorage.setItem('token', token);
                    localStorage.setItem('username', username);
                    document.getElementById("auth-section").style.display = "none";
                    document.getElementById("rooms-section").style.display = "block";
                } else {
                    document.getElementById("auth-error").innerText = data.error;
                }
            });
        }

        function register() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.message) {
                    alert(data.message);
                } else {
                    document.getElementById("auth-error").innerText = data.error;
                }
            });
        }

        function createRoom() {
            const name = document.getElementById("room-name").value;
            const isPublic = document.getElementById("room-visibility").value === "true";

            fetch('/api/rooms', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ name, isPublic, maxMessages: 100 })
            })
            .then(res => res.json())
            .then(data => {
                if (data.roomId) {
                    alert(`Комната создана: ${data.roomId}`);
                } else {
                    document.getElementById("rooms-error").innerText = data.error;
                }
            });
        }

        function getPublicRooms() {
    fetch('/api/rooms/public', { method: 'GET' })
        .then(res => res.json())
        .then(data => {
            const roomsDiv = document.getElementById("public-rooms");
            roomsDiv.innerHTML = "";
            data.forEach(room => {
                const roomElement = document.createElement("div");
                roomElement.innerText = `${room.name} (${room.membersCount} участников)`;
                const joinButton = document.createElement("button");
                joinButton.innerText = "Присоединиться";
                joinButton.onclick = () => {
                    // Перенаправляем на страницу чатов с параметром pubid
                    window.location.href = `/chats?pubid=${room.roomId}`;
                };
                roomElement.appendChild(joinButton);
                roomsDiv.appendChild(roomElement);
            });
        });
}
    </script>
          
</body>
</html>
